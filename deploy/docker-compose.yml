services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 3s
      timeout: 3s
      retries: 15

  flyway:
    image: flyway/flyway:11-alpine
    command: -connectRetries=30 migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/shortlink
      FLYWAY_USER: shortlink
      FLYWAY_PASSWORD: shortlink
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
